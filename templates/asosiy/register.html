<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — OLX Uz Clone</title>
    <style>
        /* --- ASOSIY SOZLAMALAR --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f2f4f5;
            color: #002f34;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER SECTION --- */
        header {
            background-color: #002f34;
            padding: 15px 100px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .logo h1 {
            color: #23e5db;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0;
        }

        .logo a {
            text-decoration: none;
        }

        /* --- REGISTER CONTAINER --- */
        .register-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .register-card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .register-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #002f34;
        }

        /* --- FORMA INPUTLARI --- */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #002f34;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #f2f4f5;
            border-radius: 4px;
            background-color: #f2f4f5;
            color: #002f34;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            background-color: #ffffff;
            border-color: #002f34;
        }

        /* Parolni ko'rsatish ko'zchalari */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            color: #7f9799;
        }

        /* --- TUGMALAR --- */
        .btn-register {
            width: 100%;
            padding: 14px;
            background-color: #002f34;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background-color: #001f22;
        }

        .btn-register:active {
            transform: scale(0.99);
        }

        /* --- LOGIN SAHIFASIGA UTISH --- */
        .login-prompt {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #406367;
        }

        .login-prompt a {
            color: #002f34;
            text-decoration: none;
            font-weight: bold;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #d8e2e3;
            padding: 20px 0;
            text-align: center;
            font-size: 12px;
            color: #7f9799;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="{% url 'home' %}"><h1>olx</h1></a>
        </div>
    </header>

    <div class="register-wrapper">
        <div class="register-card">
            <div class="register-title">Создать профиль</div>
            
            <form action="{% url 'register' %}" method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="first_name">Foydalanuvchi nomi (Username)</label>
                    <input type="text" id="username" name="username" required placeholder="Masalan: asadbek_01">
                </div>
                
                <div class="form-group">
                    <label for="email">Email manzil</label>
                    <input type="email" id="email" name="email" required placeholder="example@mail.com">
                </div>
                <div class="form-group">
                    <label for="phone">Telefon raqam</label>
                    <input type="text" id="phone" name="phone" required placeholder="+998901234567">
              </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Kamida 6 ta belgi">
                    <span class="password-toggle" id="togglePass" onclick="togglePassword('password', 'togglePass')">👁️</span>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Повторите пароль</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Parolni qayta kiriting">
                    <span class="password-toggle" id="toggleConfirmPass" onclick="togglePassword('confirm_password', 'toggleConfirmPass')">👁️</span>
                </div>
                
                <button type="submit" class="btn-register">Зарегистрироваться</button>
            </form>
            
            <div class="login-prompt">
                Уже есть профиль? <a href="{% url 'login' %}">Войти</a>
            </div>
        </div>
    </div>

    <footer>
        <div>© 2026 OLX Uz Clone. Barcha huquqlar himoyalangan.</div>
    </footer>

    <script>
        function togglePassword(inputId, iconId) {
            var passInput = document.getElementById(inputId);
            var toggleIcon = document.getElementById(iconId);
            
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.textContent = "🙈";
            } else {
                passInput.type = "password";
                toggleIcon.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
