<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войти — OLX Uz Clone</title>
    <style>
        /* --- ASOSIY SOZLAMALAR --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f2f4f5;
            color: #002f34;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- HEADER SECTION --- */
        header {
            background-color: #002f34;
            padding: 15px 100px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .logo h1 {
            color: #23e5db;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
            margin: 0;
        }

        .logo a {
            text-decoration: none;
        }

        /* --- LOGIN CONTAINER --- */
        .login-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .login-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            color: #002f34;
        }

        /* --- ERROR MESSAGE --- */
        .error-alert {
            background-color: #ffe6e6;
            color: #cc0000;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
            border: 1px solid #ffa3a3;
        }

        /* --- FORMA INPUTLARI --- */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #002f34;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 2px solid #f2f4f5;
            border-radius: 4px;
            background-color: #f2f4f5;
            color: #002f34;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            background-color: #ffffff;
            border-color: #002f34;
        }

        /* Parolni ko'rsatish ko'zchasi */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 42px;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
            color: #7f9799;
        }

        /* --- LINKLAR --- */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: #002f34;
        }

        .forgot-password {
            color: #002f34;
            text-decoration: none;
            font-weight: bold;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* --- TUGMALAR --- */
        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #002f34;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-login:hover {
            background-color: #001f22;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        /* --- RO'YXATDAN O'TISH LINKI --- */
        .register-prompt {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #406367;
        }

        .register-prompt a {
            color: #002f34;
            text-decoration: none;
            font-weight: bold;
        }

        .register-prompt a:hover {
            text-decoration: underline;
        }

        /* --- FOOTER --- */
        footer {
            background-color: #ffffff;
            border-top: 1px solid #d8e2e3;
            padding: 20px 0;
            text-align: center;
            font-size: 12px;
            color: #7f9799;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="{% url 'home' %}"><h1>olx</h1></a>
        </div>
    </header>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-title">Войти в профиль</div>
            
            {% if error %}
                <div class="error-alert">
                    {{ error }}
                </div>
            {% endif %}
            
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">Email yoki foydalanuvchi nomi</label>
                    <input type="text" id="username" name="username" value="{{ request.POST.username|default:'' }}" required placeholder="example@mail.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required placeholder="Kamida 6 ta belgi">
                    <span class="password-toggle" id="togglePass" onclick="togglePassword()">👁️</span>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Запомнить меня</span>
                    </label>
                    <a href="#" class="forgot-password">Забыли пароль?</a>
                </div>
                
                <button type="submit" class="btn-login">Войти</button>
            </form>
            
            <div class="register-prompt">
                Вы еще ne zaregistrirovani? <a href="{% url 'register' %}">Регистрация</a>
            </div>
        </div>
    </div>

    <footer>
        <div>© 2026 OLX Uz Clone. Barcha huquqlar himoyalangan.</div>
    </footer>

    <script>
        function togglePassword() {
            var passInput = document.getElementById("password");
            var toggleIcon = document.getElementById("togglePass");
            
            if (passInput.type === "password") {
                passInput.type = "text";
                toggleIcon.textContent = "🙈";
            } else {
                passInput.type = "password";
                toggleIcon.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
